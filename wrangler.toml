# Cloudflare Workers configuration for the Silo backend.
# A single authenticated Gemini proxy (POST /api/gemini): classify image,
# extract + classify links, suggest a schedule, and the assistant. Nothing else.

name = "silo-api"
main = "workers/index.ts"
compatibility_date = "2024-01-01"

# Secrets (set via: wrangler secret put SECRET_NAME)
# This Worker's ONLY job is to proxy Google Gemini so the API key never ships in
# the client. It needs exactly one secret + one optional gate token:
# - GEMINI_API_KEY: Google Gemini API key — the ONLY external service.
# - APP_CLIENT_TOKEN: (optional) shared client token gating /api/*. Set the SAME
#     value as EXPO_PUBLIC_CLIENT_TOKEN in the app's .env. Until set, endpoints
#     fail open; once set, /api/gemini rejects requests without a matching
#     X-Silo-Client header.
# ElevenLabs + Vultr were removed (sponsor prizes, not requirements) — the only
# endpoint is POST /api/gemini. See LAUNCH_REPORT.md for the cost picture.

# Per-IP rate limiting (Phase 3) uses a KV namespace. Create it once:
#   wrangler kv:namespace create RATE_LIMIT_KV
# then paste the returned id below and uncomment the binding:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<your-kv-namespace-id>"

# Sync (POST /api/sync) is backed by D1. See SYNC.md.
# LOCAL (Mode 1): `wrangler dev` auto-creates a local SQLite file under
#   .wrangler/ — no cloud account, no `database_id` needed. Sync works offline.
# CLOUD (Mode 2/3): create the DB once and paste its id:
#   wrangler d1 create silo-sync   # then set database_id below + deploy
[[d1_databases]]
binding = "SYNC_DB"
database_name = "silo-sync"
database_id = "local"   # placeholder; replace with the real id before a cloud deploy

# Mode switch (see SYNC.md). false/unset = pairing-code spaces (local/self-host),
# 'true' = account-gated spaces (public). Set via wrangler.toml or a secret.
[vars]
REQUIRE_AUTH = "false"

